<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Studio Background Canvas -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Premium Monochrome Metallic Gradients -->
    <linearGradient id="grad-platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F4F4F5"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="grad-silver" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="50%" stop-color="#71717A"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>

    <linearGradient id="grad-graphite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="60%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>

    <linearGradient id="grad-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="elevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bg-glow)"/>

  <!-- Minimalist Square Matrix -->
  <g filter="url(#elevation)">
    
    <!-- Central Rotated Diamond Core (4 Deconstructed Curved Square Tiles) -->
    <g transform="translate(250, 250) rotate(45)">
      <!-- Top-Left Core Quadrant -->
      <rect x="-70" y="-70" width="65" height="65" rx="16" fill="url(#grad-platinum)"/>
      <!-- Top-Right Core Quadrant -->
      <rect x="5" y="-70" width="65" height="65" rx="16" fill="url(#grad-silver)"/>
      <!-- Bottom-Right Core Quadrant -->
      <rect x="5" y="5" width="65" height="65" rx="16" fill="url(#grad-graphite)"/>
      <!-- Bottom-Left Core Quadrant -->
      <rect x="-70" y="5" width="65" height="65" rx="16" fill="url(#grad-obsidian)"/>

      <!-- Focal Core Accent (Floating Minimal Inset) -->
      <rect x="-22" y="-22" width="44" height="44" rx="12" fill="#FFFFFF"/>
      <rect x="-14" y="-14" width="28" height="28" rx="8" fill="#0A0A0C"/>
    </g>

    <!-- 4 Satellite Quadrant Squares -->
    <!-- Top-Left Satellite -->
    <rect x="105" y="105" width="70" height="70" rx="20" fill="url(#grad-platinum)"/>
    
    <!-- Top-Right Satellite -->
    <rect x="325" y="105" width="70" height="70" rx="20" fill="url(#grad-silver)"/>
    
    <!-- Bottom-Right Satellite -->
    <rect x="325" y="325" width="70" height="70" rx="20" fill="url(#grad-platinum)"/>
    
    <!-- Bottom-Left Satellite -->
    <rect x="105" y="325" width="70" height="70" rx="20" fill="url(#grad-graphite)"/>

  </g>
</svg>
